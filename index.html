<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakeside</title>
<style>
  html, body { margin: 0; height: 100%; background: #3d7cc4; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  #hint, #loading {
    position: fixed; left: 50%; transform: translateX(-50%);
    font: 500 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: .04em;
    color: rgba(255,255,255,.95); text-shadow: 0 1px 6px rgba(0,0,0,.5);
    pointer-events: none; transition: opacity 1.5s ease; white-space: nowrap;
  }
  #hint { bottom: 26px; }
  #loading { top: 45%; font-size: 15px; }
  #mute {
    position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.28); color: #fff; cursor: pointer; display: grid; place-items: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #mute svg { width: 20px; height: 20px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="loading">Growing the valley…</div>
<div id="hint">Click the water to start · move to ripple · click to splash · hold to stir</div>
<button id="mute" aria-label="Mute sound" title="Mute">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>
  </svg>
</button>
<script type="module">
import * as THREE from 'three';

// ---------- scene constants ----------
const CAM_H = 1.7;                     // eye height above the water (m)
// The simulation grid follows the perspective: columns fan out from the viewer (x/z) and rows grow
// geometrically with distance, so every cell is square and the same grid covers the whole lake.
const SIM_Z0 = 2.6, SIM_ZMAX = 1200, SIM_S = 2.6;  // nearest row, farthest row (m), lateral spread (x/z)
const SIM_NU = 256, SIM_K = Math.log(SIM_ZMAX / SIM_Z0), SIM_NV = Math.round(SIM_NU * SIM_K / SIM_S);
const SIM_CREF = 0.03;                             // cell size (m) where waves step at the reference rate
const STRIPS = 32;                     // the valley is ray-marched once, a strip per frame (small strips keep the GPU responsive)
// waterfall: one stream plunging in a single drop over a sheer rock band on the right-hand ridge
const FALL = { x: 850, zc: 2450, drop: 230, base: 260 };   // stream x, cliff line z, cliff height, approx. cliff-foot height (m)
const gullyX = z => FALL.x + 30 * Math.sin(z * 0.008 + 1.0);
const SUN = new THREE.Vector3(-0.85, 0.5, -0.15).normalize();    // low from the left, so ridges and gullies model in light and shade

const COMMON = /* glsl */`
const float CAM_H = ${CAM_H.toFixed(2)};
const float SIM_Z0 = ${SIM_Z0.toFixed(2)}, SIM_K = ${SIM_K.toFixed(6)}, SIM_S = ${SIM_S.toFixed(2)}, SIM_NU = ${SIM_NU}.0, SIM_CREF = ${SIM_CREF};
float simCell(float v){ return SIM_Z0 * exp(v * SIM_K) * SIM_S / SIM_NU; }   // metres per cell on row v
const vec3 SUN_COL = vec3(1.0, 0.95, 0.86) * 2.6;
const vec3 SKY_AMB = vec3(0.30, 0.42, 0.62) * 0.55;
const vec3 HAZE = vec3(0.34, 0.49, 0.76);
float shoreZ(float x){ return 3.0 + max(x - 0.4, 0.0) * 0.45 + 0.06 * sin(x * 2.3) + 0.04 * sin(x * 5.1 + 1.0); }
vec2 simUv(vec2 p){ return vec2(p.x / p.y / SIM_S + 0.5, log(max(p.y, 0.01) / SIM_Z0) / SIM_K); }
vec2 simWorld(vec2 uv){ float z = SIM_Z0 * exp(uv.y * SIM_K); return vec2((uv.x - 0.5) * SIM_S * z, z); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
const mat2 ROT = mat2(0.8, -0.6, 0.6, 0.8);
float fbmN(vec2 p, int oct){ float s = 0.0, a = 0.5, w = 0.0;
  for (int i = 0; i < oct; i++){ s += a * vnoise(p); w += a; p = ROT * p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s / w; }
float fbm(vec2 p){ return fbmN(p, 5); }
`;
const shoreZ = x => 3.0 + Math.max(x - 0.4, 0) * 0.45 + 0.06 * Math.sin(x * 2.3) + 0.04 * Math.sin(x * 5.1 + 1.0);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
// if the GPU driver resets, ask for the context back and rebuild the page once it returns
renderer.domElement.addEventListener('webglcontextlost', e => e.preventDefault());
renderer.domElement.addEventListener('webglcontextrestored', () => location.reload());
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quad.frustumCulled = false; quadScene.add(quad);
const QUAD_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
function draw(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); }

// ---------- the valley: hills, forest, fields, ray-marched once into a texture ----------
// Everything above the waterline is rendered from the eye point looking north over the lake.
// env pixel (x, y) = screen pixel (x, horizon + y); it extends above the screen so steep reflections still find sky.
const terrainMat = new THREE.ShaderMaterial({
  uniforms: { uEnv: { value: new THREE.Vector2(1, 1) }, uF: { value: 1 }, uSun: { value: SUN }, uMode: { value: 0 } },
  vertexShader: QUAD_VS,
  fragmentShader: COMMON + /* glsl */`
    uniform vec2 uEnv; uniform float uF; uniform vec3 uSun;
    // value noise with analytic derivatives (quintic, so slopes stay smooth)
    vec3 noised(vec2 x){
      vec2 i = floor(x), f = fract(x);
      vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0), du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
      float a = hash12(i), b = hash12(i + vec2(1, 0)), c = hash12(i + vec2(0, 1)), d = hash12(i + vec2(1, 1));
      float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
      return vec3(a + k1 * u.x + k2 * u.y + k4 * u.x * u.y, du * vec2(k1 + k4 * u.y, k2 + k4 * u.x)) * 2.0 - vec3(1.0, 0.0, 0.0);
    }
    // erosion-like fbm (Quilez): fine detail is damped wherever the larger shapes are already steep,
    // which leaves sharp crests, smooth valley floors and branching gullies down the slopes
    float eroded(vec2 p, int oct){
      float a = 0.0, b = 0.5; vec2 d = vec2(0.0);
      for (int i = 0; i < oct; i++) {
        vec3 n = noised(p); d += n.yz;
        a += b * n.x / (1.0 + dot(d, d));
        b *= 0.5; p = ROT * p * 2.0 + vec2(3.1, 1.7);
      }
      return a;
    }
    float bump(vec2 p, vec2 c, vec2 r){ vec2 d = (p - c) / r; return exp(-dot(d, d)); }
    const float WX = ${FALL.x}.0, WZC = ${FALL.zc}.0, WDROP = ${FALL.drop}.0;
    // a stream comes down a gully on the ridge and leaves the lip of one sheer rock band in a single plunge
    float gullyX(float z){ return WX + 30.0 * sin(z * 0.008 + 1.0); }
    float gullyAlong(float z){ return smoothstep(WZC - 500.0, WZC - 300.0, z) * (1.0 - smoothstep(WZC + 150.0, WZC + 300.0, z)); }
    float gullyD(vec2 p){ return abs(p.x - gullyX(p.y)); }
    float baseH(vec2 p){
      float h = 0.0;
      h += 190.0 * bump(p, vec2(-780.0, 1250.0), vec2(520.0, 400.0));      // forested hill, left
      h += 130.0 * bump(p, vec2(-1350.0, 1550.0), vec2(520.0, 520.0));
      h += 300.0 * bump(p, vec2(-450.0, 2700.0), vec2(700.0, 520.0));      // valley ridges, middle
      h += 430.0 * bump(p, vec2(250.0, 3400.0), vec2(1400.0, 700.0));
      h += 470.0 * smoothstep(-300.0, 2300.0, p.x) * exp(-pow((p.y - 2500.0 - p.x * 0.25) / 800.0, 2.0));   // long ridge, right
      h += 165.0 * bump(p, vec2(1000.0, 1650.0), vec2(650.0, 330.0));      // lower hill, right
      h += 1450.0 * smoothstep(5500.0, 9500.0, p.y) * (0.5 + 0.5 * vnoise(vec2(p.x * 0.00035, 1.3)));   // far blue range
      h += 330.0 * bump(p, vec2(WX, 2650.0), vec2(450.0, 380.0));        // high shoulder of the right ridge
      // one hard rock band: a single sheer cliff across the ridge face, a plunge basin below it
      float wallW = 1.0 - smoothstep(70.0, 150.0, gullyD(p) + 70.0 * vnoise(p * 0.012));
      float zc = WZC + 30.0 * (vnoise(vec2(p.x * 0.015, 4.0)) - 0.5) * smoothstep(20.0, 60.0, gullyD(p));   // ragged cliff line
      h -= WDROP * wallW * (1.0 - smoothstep(zc - 3.0, zc + 3.0, p.y)) * smoothstep(WZC - 420.0, WZC - 120.0, p.y);
      // the stream's gully above the lip
      h -= 22.0 * (1.0 - smoothstep(0.0, 60.0, gullyD(p))) * smoothstep(WZC - 5.0, WZC + 10.0, p.y) * (1.0 - smoothstep(WZC + 300.0, WZC + 450.0, p.y));
      float land = smoothstep(650.0, 1000.0, p.y + 260.0 * (vnoise(vec2(p.x * 0.0018, 2.0)) - 0.5));
      h += 6.0 + 35.0 * fbmN(p * 0.0025 + 5.0, 3);                       // low wooded foothills along the far shore
      return h * land + mix(-25.0, 0.0, land);
    }
    float terrain(vec2 p, int oct){
      float b = baseH(p);
      float m = smoothstep(0.0, 40.0, b);
      vec2 q = p * 0.0016;
      q += (vec2(fbmN(q * 0.7 + 3.1, 3), fbmN(q * 0.7 + 7.7, 3)) - 0.5) * 0.6;
      float calm = 1.0 - 0.45 * (1.0 - smoothstep(150.0, 320.0, gullyD(p))) * gullyAlong(p.y);
      return b + eroded(q, oct) * (40.0 + min(b, 500.0) * 0.45) * m * calm;
    }
    float crowns(vec2 p){ return vnoise(p * 0.22) * 0.65 + vnoise(p * 0.5 + 3.0) * 0.35; }

    float march(vec3 rd){
      vec3 ro = vec3(0.0, CAM_H, 0.0);
      float t = 250.0, tp = t; bool hit = false;
      for (int i = 0; i < 340; i++) {
        vec3 p = ro + rd * t;
        if (p.y > 2300.0 || t > 26000.0) break;
        float dh = p.y - terrain(p.xz, 4);
        if (dh < 0.0) { hit = true; break; }
        tp = t; t += max(dh * 0.45, t * 0.003);
      }
      if (!hit) return -1.0;
      for (int i = 0; i < 7; i++) { float tm = (tp + t) * 0.5; vec3 p = ro + rd * tm; if (p.y < terrain(p.xz, 7)) t = tm; else tp = tm; }
      return t;
    }
    vec4 shade(vec3 rd){
      float t = march(rd);
      if (t < 0.0) return vec4(0.0);
      vec3 p = vec3(0.0, CAM_H, 0.0) + rd * t;
      float fp = t / uF;                                   // metres covered by one pixel
      float e = max(0.6, fp);
      float hc = terrain(p.xz, 9);
      vec3 n = normalize(vec3(hc - terrain(p.xz + vec2(e, 0.0), 9), e, hc - terrain(p.xz + vec2(0.0, e), 9)));
      float slope = 1.0 - n.y;

      // ground cover
      float fieldM = smoothstep(0.56, 0.66, fbmN(p.xz * 0.0015 + 9.0, 4)) * smoothstep(0.0, 700.0, p.x)
                   * smoothstep(0.5, 0.25, slope) * smoothstep(60.0, 160.0, p.y);
      float rockM = smoothstep(0.55, 0.75, slope + (vnoise(p.xz * 0.02) - 0.5) * 0.3);
      float shoreM = (1.0 - smoothstep(0.5, 3.0, p.y)) * smoothstep(0.4, 0.6, vnoise(p.xz * 0.004));   // stony patches, trees elsewhere
      float forest = (1.0 - fieldM) * (1.0 - rockM) * (1.0 - shoreM);

      // tree crowns: small bumps that catch light, faded once they are smaller than a pixel
      float ca = smoothstep(3.0, 0.9, fp) * forest;
      float c0 = crowns(p.xz);
      vec2 cg = vec2(crowns(p.xz + vec2(0.7, 0.0)) - c0, crowns(p.xz + vec2(0.0, 0.7)) - c0) / 0.7;
      n = normalize(n + vec3(-cg.x, 0.0, -cg.y) * 1.6 * ca);

      vec3 forestC = mix(vec3(0.016, 0.050, 0.012), vec3(0.040, 0.095, 0.020), vnoise(p.xz * 0.04));
      forestC = mix(forestC, vec3(0.06, 0.09, 0.03), smoothstep(0.65, 0.85, fbmN(p.xz * 0.006, 3)) * 0.6);
      forestC *= mix(1.0, 0.55 + 0.75 * c0, smoothstep(6.0, 1.0, fp));
      forestC *= 0.65 + 0.7 * fbmN(p.xz * 0.035, 3);                      // clumps of taller and darker trees
      vec2 fq = mat2(0.9, 0.43, -0.43, 0.9) * p.xz / vec2(55.0, 35.0);
      vec3 fieldC = mix(vec3(0.09, 0.13, 0.03), vec3(0.24, 0.20, 0.08), hash12(floor(fq)));
      fieldC *= 0.82 + 0.18 * step(0.18, fract(p.y / 5.0));       // terraces
      float strata = vnoise(vec2((p.x + p.z) * 0.02, p.y * 0.22));
      vec3 rockC = vec3(0.17, 0.15, 0.12) * (0.7 + 0.5 * strata) * (0.8 + 0.4 * vnoise(p.xz * 0.1));
      vec2 rq = vec2((p.x + p.z) * 0.06, p.y * 0.09);
      float r0 = fbmN(rq, 3);
      n = normalize(n + rockM * vec3((fbmN(rq + vec2(0.05, 0.0), 3) - r0) * 14.0, (fbmN(rq + vec2(0.0, 0.05), 3) - r0) * 14.0, 0.0));
      vec3 shoreC = vec3(0.26, 0.23, 0.19) * (0.8 + 0.4 * vnoise(p.xz * 0.3));
      vec3 alb = forestC * forest + fieldC * fieldM * (1.0 - rockM) * (1.0 - shoreM) + rockC * rockM * (1.0 - shoreM) + shoreC * shoreM;
      // the rock bands: dark wet rock with vertical water stains and moss on the ledges, wettest in the gully
      float faceZone = (1.0 - smoothstep(150.0, 300.0, gullyD(p.xz))) * gullyAlong(p.z) * rockM;
      vec3 wetRock = vec3(0.15, 0.14, 0.12) * (0.7 + 0.5 * strata) * (0.75 + 0.35 * vnoise(vec2(p.x * 0.15, p.y * 0.01)))
                   * (1.0 - 0.4 * smoothstep(0.55, 0.8, vnoise(vec2(p.x * 0.06, p.y * 0.003 + 3.0))));
      wetRock = mix(wetRock, vec3(0.07, 0.11, 0.04), smoothstep(0.6, 0.8, vnoise(p.xz * 0.08 + p.y * 0.05)) * 0.7);
      wetRock *= 1.0 - 0.4 * (1.0 - smoothstep(15.0, 60.0, gullyD(p.xz)));
      alb = mix(alb, wetRock, faceZone);

      // soft sun shadow from the terrain itself
      float sh = 1.0; vec3 q = p + n * 2.0; float s = 8.0;
      for (int i = 0; i < 40; i++) {
        vec3 r = q + uSun * s;
        float d = r.y - terrain(r.xz, 4);
        sh = min(sh, clamp(10.0 * d / s, 0.0, 1.0));
        if (sh < 0.01 || r.y > 2300.0) break;
        s *= 1.17;
      }
      float dif = max(dot(n, uSun), 0.0) * mix(1.0, 0.8, forest);
      float r = max(12.0, fp * 3.0);
      float hn = (terrain(p.xz + vec2(r, 0.0), 6) + terrain(p.xz - vec2(r, 0.0), 6) + terrain(p.xz + vec2(0.0, r), 6) + terrain(p.xz - vec2(0.0, r), 6)) * 0.25;
      float cav = clamp(0.8 + (hc - hn) / r * 0.9, 0.35, 1.15);           // gullies sit in shade, crests catch the sky
      vec3 amb = mix(SKY_AMB, vec3(0.20, 0.26, 0.24) * 0.55, forest * 0.6);
      vec3 col = alb * (SUN_COL * 1.15 * dif * sh * mix(1.0, cav, 0.5) + amb * 0.7 * (0.55 + 0.45 * n.y) * cav);

      // air between the viewer and the hills: distant ridges fade into blue
      vec3 ext = exp(-t * vec3(0.00007, 0.00010, 0.00016));
      col = col * ext + HAZE * 0.9 * (1.0 - ext);
      return vec4(col, 1.0);
    }

    uniform float uMode;
    void main(){
      vec2 fc = gl_FragCoord.xy;
      if (uMode > 0.5) {          // where the cliff face is visible: (across, up, on-face, distance)
        vec3 rd = normalize(vec3((fc.x - uEnv.x * 0.5) / uF, fc.y / uF, 1.0));
        float t = march(rd);
        if (t < 0.0) { gl_FragColor = vec4(0.0); return; }
        vec3 p = vec3(0.0, CAM_H, 0.0) + rd * t;
        float hw = 18.0;                                        // a 36 m wide ribbon
        float lip = baseH(vec2(gullyX(WZC + 15.0), WZC + 15.0)), foot = baseH(vec2(gullyX(WZC - 30.0), WZC - 30.0));
        float onFace = (1.0 - smoothstep(hw * 0.7, hw, gullyD(p.xz))) * step(WZC - 70.0, p.z) * step(p.z, WZC + 25.0) * step(foot - 15.0, p.y);
        gl_FragColor = vec4((p.x - gullyX(p.z)) / (2.0 * hw) + 0.5, (p.y - foot) / max(lip - foot, 1.0), onFace, t * 1e-4);
        return;
      }
      vec4 acc = vec4(0.0);
      for (int k = 0; k < 2; k++) {                         // two rays per pixel for clean ridgelines
        vec2 o = k == 0 ? vec2(-0.25, -0.25) : vec2(0.25, 0.25);
        vec3 rd = normalize(vec3((fc.x + o.x - uEnv.x * 0.5) / uF, (fc.y + o.y) / uF, 1.0));
        acc += shade(rd);
      }
      gl_FragColor = acc * 0.5;     // premultiplied, alpha = coverage
    }`,
});

// sky + drifting cumulus + the valley, composed every frame
const envMat = new THREE.ShaderMaterial({
  uniforms: { uTerrain: { value: null }, uWF: { value: null }, uEnv: { value: new THREE.Vector2(1, 1) }, uF: { value: 1 }, uTime: { value: 0 },
    uMist: { value: new THREE.Vector2() }, uMistR: { value: 1 } },
  vertexShader: QUAD_VS,
  fragmentShader: COMMON + /* glsl */`
    uniform sampler2D uTerrain, uWF; uniform vec2 uEnv, uMist; uniform float uF, uTime, uMistR;
    float cloudD(vec2 a){
      vec2 q = vec2(a.x * 2.6 + uTime * 0.0025, a.y * 5.5);
      float cov = 0.85 + 0.6 * (vnoise(vec2(a.x * 1.1 + 4.0, 0.5)) - 0.5);
      float band = 1.0 - smoothstep(0.03, 0.36, a.y);
      float base = smoothstep(0.035, 0.075, a.y + 0.025 * vnoise(vec2(a.x * 3.0, 1.0)));
      return (fbmN(q, 6) * 1.2 + band * 0.55 * cov - 0.9) * base;
    }
    void main(){
      vec2 fc = gl_FragCoord.xy;
      vec3 rd = normalize(vec3((fc.x - uEnv.x * 0.5) / uF, fc.y / uF, 1.0));
      vec2 a = vec2(rd.x / rd.z, rd.y / length(rd.xz));
      vec3 col = mix(HAZE * 1.05, vec3(0.03, 0.13, 0.48), pow(clamp(a.y / 0.8, 0.0, 1.0), 0.5));
      float d = cloudD(a);
      if (d > -0.05) {
        float ds = cloudD(a + vec2(-0.004, 0.008));     // toward the light: brighter rims, grey hollows
        float lit = clamp(0.72 + (d - ds) * 5.0 + 0.3 * smoothstep(0.05, 0.22, a.y), 0.0, 1.0);
        vec3 cc = mix(vec3(0.46, 0.53, 0.66), vec3(1.0, 0.99, 0.97) * 1.25, lit);
        cc = mix(cc, HAZE * 1.1, (1.0 - smoothstep(0.0, 0.09, a.y)) * 0.45);
        col = mix(col, cc, smoothstep(0.0, 0.16, d));
      }
      vec4 tr = texture2D(uTerrain, fc / uEnv);
      col = col * (1.0 - tr.a) + tr.rgb;

      // the waterfall, painted onto the cliff face where it is visible
      vec4 wf = texture2D(uWF, fc / uEnv);
      if (wf.z > 0.01) {
        float u = wf.x, fall = 1.0 - clamp(wf.y, 0.0, 1.1);           // 0 at the lip, 1 at the foot
        float edge = smoothstep(0.0, 0.18, u) * smoothstep(1.0, 0.82, u);
        float strands = vnoise(vec2(u * 7.0, 0.5)) * 0.6 + vnoise(vec2(u * 17.0, 2.0)) * 0.4;
        float s = fbmN(vec2(u * 8.0, fall * 14.0 - uTime * 1.8), 4);     // white water racing down
        // a solid sheet at the lip that frays into strands and spray as it falls
        float dens = edge * mix(0.85 + 0.15 * s, (0.45 + 0.55 * strands) * (0.6 + 0.5 * s), smoothstep(0.1, 0.9, fall));
        vec3 wc = mix(vec3(0.60, 0.66, 0.71), vec3(1.0, 1.0, 0.98) * 1.2, smoothstep(0.3, 0.7, s));
        vec3 ex = exp(-wf.w * 1e4 * vec3(0.00007, 0.00010, 0.00016));
        wc = wc * ex + HAZE * 0.9 * (1.0 - ex);
        col = mix(col, wc, wf.z * dens);
      }
      // spray and mist boiling up from the plunge pool
      vec2 md = (fc - uMist) / uMistR;

  wfRT.scissorTest = true;

// ---------- sound: every water noise is built from ringing air bubbles ----------
// Physics (Minnaert 1933; van den Doel 2005; Pumphrey & Crum; Cambridge drip study): the splash itself is
// nearly silent. What we hear is air trapped under the surface, ringing as a decaying sine whose pitch rises
// as it nears the surface. Its size sets the pitch: f ≈ 3.26 kHz / radius in mm.

    const beta = Math.PI * f0 * damp / stretch;                  // decay rate (1/s), stretched a little for the ear
    const xi = 0.1;                                              // pitch rise near the surface

    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(peak, now + len * 0.35); g.gain.exponentialRampToValueAtTime(0.0005, now + len);
    src.connect(lp).connect(g).connect(master); src.stop(now + len + 0.1);
    setTimeout(() => play(pick(fizzes), 0.35 + r() * 0.3, 0.9 + r() * 0.2, 0.15), len * 0.3 * 1000);
    setTimeout(lapLoop, (1.8 + r() * 2.6) * 1000);
  }
  function bird() {
    const now = ctx.currentTime, pan = ctx.createStereoPanner(), g = ctx.createGain();
    pan.pan.value = r() * 1.6 - 0.8; g.gain.value = 0.015 + r() * 0.02;
    g.connect(pan).connect(master);
    const v = ctx.createGain(); v.gain.value = 0.5; g.connect(v).connect(verb);
    const base = 2600 + r() * 2000, notes = 2 + Math.floor(r() * 5), gap = 0.08 + r() * 0.1;
    for (let i = 0; i < notes; i++) {
      const o = ctx.createOscillator(), ng = ctx.createGain(), t0 = now + i * gap, d = 0.05 + r() * 0.07;
      const f0 = base * (0.85 + r() * 0.3);
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(f0 * (r() < 0.5 ? 1.35 : 0.7), t0 + d);
      ng.gain.setValueAtTime(0, t0); ng.gain.linearRampToValueAtTime(1, t0 + 0.012); ng.gain.exponentialRampToValueAtTime(0.001, t0 + d);
      o.connect(ng).connect(g); o.start(t0); o.stop(t0 + d + 0.02);
    }
    setTimeout(bird, (1.5 + r() * 6) * 1000);
  }
  return {
    start() {
      if (ctx) { ctx.resume(); return; }
      ctx = new AudioContext();
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ctx.destination);
      // open air: a short, soft, dark reverb tail
      verb = ctx.createConvolver();
      const sr = ctx.sampleRate, ir = ctx.createBuffer(2, Math.floor(sr * 1.6), sr);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let a = 0;
        for (let i = 0; i < d.length; i++) { a += ((r() * 2 - 1) - a) * 0.25; d[i] = a * Math.exp(-i / (sr * 0.32)); } }
      verb.buffer = ir; const vg = ctx.createGain(); vg.gain.value = 0.5; verb.connect(vg).connect(master);
      noiseBuf = ctx.createBuffer(1, sr * 4, sr);
      { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
      for (let i = 0; i < 8; i++) splashes.push(makeSplash());
      for (let i = 0; i < 32; i++) grains.push(makeGrain());
      for (let i = 0; i < 8; i++) fizzes.push(makeFizz());
      // the waterfall, 2 km away: a steady roar of countless bubbles; the air soaks up its highs on the way,
      // leaving a smooth low rumble that swells and fades as the breeze carries it
      const roar = ctx.createBuffer(2, sr * 8, sr);
      for (let c = 0; c < 2; c++) {
        const d = roar.getChannelData(c); let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < d.length; i++) {   // pink noise (Kellet)
          const w = r() * 2 - 1;
          b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
          b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
          d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
        }
      }
      const rs = ctx.createBufferSource(); rs.buffer = roar; rs.loop = true;
      const rlp = ctx.createBiquadFilter(); rlp.type = 'lowpass'; rlp.frequency.value = 1400; rlp.Q.value = 0.3;
      const rsh = ctx.createBiquadFilter(); rsh.type = 'lowshelf'; rsh.frequency.value = 180; rsh.gain.value = 6;
      const rg = ctx.createGain(); rg.gain.value = 0.11;
      for (const [hz, depth] of [[0.05, 0.025], [0.13, 0.015]]) {
        const o = ctx.createOscillator(), og = ctx.createGain(); o.frequency.value = hz; og.gain.value = depth;
        o.connect(og).connect(rg.gain); o.start();
      }
      const rp = ctx.createStereoPanner(); rp.pan.value = 0.35;     // the falls are on the right-hand ridge
      rs.connect(rlp).connect(rsh).connect(rg).connect(rp).connect(master);
      const rv = ctx.createGain(); rv.gain.value = 0.4; rg.connect(rv).connect(verb);
      rs.start();
      // wind through the trees
      const wf = ctx.createBiquadFilter(), wg = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
      wf.type = 'bandpass'; wf.frequency.value = 420; wf.Q.value = 0.35; wg.gain.value = 0.018;
      lfo.frequency.value = 0.06; lg.gain.value = 0.013; lfo.connect(lg).connect(wg.gain); lfo.start();
      noiseSrc().connect(wf).connect(wg).connect(master);
      // body of water pushed by the hand
      sloshF = ctx.createBiquadFilter(); slosh = ctx.createGain();
      sloshF.type = 'lowpass'; sloshF.frequency.value = 400; slosh.gain.value = 0;
      noiseSrc().connect(sloshF).connect(slosh).connect(master);
      lapLoop(); setTimeout(bird, 900);
    },
    stir(speed, dt, holding) {
      if (!ctx) return;
      const now = ctx.currentTime;
      slosh.gain.setTargetAtTime(Math.min(speed * 0.014, 0.08) * (holding ? 1.4 : 1), now, 0.12);
      sloshF.frequency.setTargetAtTime(280 + Math.min(speed, 8) * 70, now, 0.15);
      let n = Math.min(speed, 10) * dt * (holding ? 7 : 4);     // bubbles shed in the wake
      while (r() < n) { play(pick(grains), 0.12 + r() * 0.12, (holding ? 0.8 : 1) + r() * 0.25, 0.15); n -= 1; }
    },
    splash(power) {
      if (!ctx) return;
      play(pick(splashes), 0.8 * power, 0.92 + r() * 0.16, 0.35);
    },
    toggle() {
      muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.05);
      return muted;
    },
  };
})();
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
muteBtn.addEventListener('click', () => {
  const m = audio.toggle();
  document.getElementById('waves').style.display = m ? 'none' : '';
  muteBtn.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
});

// ---------- cursor ----------
const cur = { x: 0, z: 0 }, prev = { x: 0, z: 0 };
let has = false, hasPrev = false, holding = false;
const hint = document.getElementById('hint');
let hintGone = false;
function toWater(e) {
  const gy = lay.H - e.clientY;
  if (gy >= lay.hor - 2) return false;
  const z = CAM_H * lay.f / (lay.hor - gy);
  const x = (e.clientX - lay.W / 2) * z / lay.f;
  cur.x = x; cur.z = z;
  return z > shoreZ(x) + 0.03 && z < SIM_ZMAX * 0.9 && Math.abs(x / z) < SIM_S * 0.48;
}
addEventListener('pointermove', e => { has = toWater(e); });
addEventListener('pointerdown', e => {
  holding = true;
  audio.start();
  if (toWater(e)) {
    has = true;
    addDrop(cur, cur, 0.17, -0.16);
    audio.splash(0.55 + 0.45 * Math.min(1, 4 / cur.z));
    if (!hintGone) { hintGone = true; setTimeout(() => hint.style.opacity = 0, 2000); }
  }
});
addEventListener('pointerup', () => { holding = false; });
addEventListener('pointercancel', () => { holding = false; has = false; });
document.addEventListener('pointerleave', () => { has = false; holding = false; });
addEventListener('blur', () => { holding = false; });

function interact(dt, t) {
  if (!has) { hasPrev = false; audio.stir(0, dt, false); return; }
  if (hasPrev) {
    const speed = Math.hypot(cur.x - prev.x, cur.z - prev.z) / dt;
    const k = holding ? 1.7 : 1;
    const s = Math.min(speed * 0.003, 0.03) * k;
    if (s > 0.0003) addDrop(prev, cur, holding ? 0.18 : 0.12, -s);
    if (holding) addDrop(cur, cur, 0.13, Math.sin(t * 13) * 0.012);
    audio.stir(speed * Math.min(1, 5 / cur.z), dt, holding);   // farther water is heard more faintly
  }
  prev.x = cur.x; prev.z = cur.z; hasPrev = true;
}

// ---------- loop ----------
const clock = new THREE.Clock();
let acc = 0;
renderer.setAnimationLoop(() => {
  // an error in one frame must never stop the loop for good
  try { frame(); } catch (err) { console.error(err); }
});
function frame() {
  const dt = Math.max(Math.min(clock.getDelta(), 0.05), 1e-3), t = clock.elapsedTime;

  // build the valley progressively (top strips first, so the sky and peaks appear before the shoreline)
  if (strip < STRIPS) {
    const h = Math.ceil(terrainRT.height / STRIPS), y = terrainRT.height - (strip + 1) * h;
    terrainRT.scissor.set(0, Math.max(0, y), terrainRT.width, h + Math.min(0, y));
    draw(terrainMat, terrainRT);
    if (++strip === STRIPS) {
      terrainMat.uniforms.uMode.value = 1; draw(terrainMat, wfRT); terrainMat.uniforms.uMode.value = 0;
      loading.style.opacity = 0;
    }
  }

  interact(dt, t);
  for (const d of drops) {
    dropMat.uniforms.uA.value.copy(d.a); dropMat.uniforms.uB.value.copy(d.b);
    dropMat.uniforms.uRadius.value = d.r; dropMat.uniforms.uStrength.value = d.s;
    simPass(dropMat);
  }
  drops.length = 0;
  acc += dt;
  let n = 0;
  while (acc >= 1 / 60 && n < 3) { simPass(updateMat); acc -= 1 / 60; n++; }
  if (n === 3) acc = 0;
  simPass(normalMat);

  envMat.uniforms.uTime.value = t;
  draw(envMat, envRT);

  U.uSim.value = simA.texture;
  U.uTime.value = t;
  draw(sceneMat, null);
}
</script>
